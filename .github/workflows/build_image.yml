name: Build and push to Docker Hub

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:   #возможность ручного запуска

jobs:
  build-check-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from branch name
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/terraria:${{ steps.get_version.outputs.version }} .

      - name: Create temporary config file
        run: |
          mkdir -p ./temp-config
          cat > ./temp-config/serverconfig.txt <<EOF
          autocreate=3
          world=/worlds/temp.wld
          maxplayers=1
          difficulty=0
          EOF

      - name: Run container and wait for healthy
        run: |
          docker run -d \
          --name terraria-test \
          -p 7777:7777 \
          -v $(pwd)/temp-config/serverconfig.txt:/terraria/config/serverconfig.txt \
          ${{ secrets.DOCKERHUB_USERNAME }}/terraria:${{ steps.get_version.outputs.version }}

          echo "Waiting for container to become healthy..."
          for i in {1..12}; do
            echo "*** Last 20 lines of logs (attempt $i) ***"
            docker logs --tail=20 terraria-test 2>&1 || echo "No logs available"
            echo "******************************************"

            sleep 30
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' terraria-test 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Container is healthy!"
              docker rm -f terraria-test
              exit 0
            fi
            echo "Attempt $i/12: status=$STATUS"
          done

          echo "❌ Healthcheck failed. Container logs:"
          docker logs terraria-test
          docker rm -f terraria-test
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/terraria:${{ steps.get_version.outputs.version }}